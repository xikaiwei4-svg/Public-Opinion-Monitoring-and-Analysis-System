﻿# ============================================================
# frontend/nginx.conf — 生产级 Nginx 配置
# 校园舆情监控与热点话题分析系统 前端容器
# ============================================================

# 不暴露 Nginx 版本号
server_tokens off;

# HTTP → HTTPS 跳转（部署 SSL 后启用，见下方 SSL 配置章节）
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name localhost;

    # ──────────────────────────────────────────────
    # 基础安全加固
    # ──────────────────────────────────────────────

    # 安全响应头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 防止大文件请求攻击
    client_max_body_size 10m;

    # 禁止访问点号开头的隐藏文件（.env, .git, .htaccess 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ──────────────────────────────────────────────
    # Gzip 压缩 — 节省带宽
    # ──────────────────────────────────────────────

    gzip on;
    gzip_types text/html application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;

    # ──────────────────────────────────────────────
    # 静态资源 — 哈希文件名，强缓存
    # ──────────────────────────────────────────────

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ──────────────────────────────────────────────
    # API 反向代理 → backend:8000
    # ──────────────────────────────────────────────

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 实时推送（/api/live/stream）需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ──────────────────────────────────────────────
    # SPA 路由回退 — 所有非文件请求返回 index.html
    # ──────────────────────────────────────────────

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # HTML 不做缓存，确保用户看到最新版本
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ──────────────────────────────────────────────
    # 日志格式
    # ──────────────────────────────────────────────

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # 🔐 HTTPS / SSL 配置
    #
    # 一键启用步骤：
    #   1. 将域名 DNS 解析到服务器 IP
    #   2. SSH 登录服务器，安装 certbot：
    #        apt install certbot python3-certbot-nginx
    #   3. 申请证书（certbot 自动配置 Nginx）：
    #        certbot --nginx -d yourdomain.com -d www.yourdomain.com
    #   4. 验证自动续期：
    #        certbot renew --dry-run
    #   5. 安全评分检测：https://www.ssllabs.com/ssltest/
    #
    # 取消下方整个 server block 的注释，替换 yourdomain.com 即可。
    # certbot 也可以自动帮你完成（上一步第 3 条），所以多数时候不需要手动改。
    # ============================================================
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     # ── Let's Encrypt 证书路径（certbot 自动放置）──
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #
    #     # ── 现代 TLS（仅允许安全协议和加密套件）──
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # ── HSTS：强制浏览器使用 HTTPS ──
    #     # 先设 3600（1 小时）测试，稳定后改为 31536000（1 年）
