# deploy.yml — 直接在服务器构建镜像部署
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 复制源代码到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "backend/,frontend/,docker-compose.yml,deploy/"
          target: /opt/campus-opinion
          strip_components: 0

      - name: 在服务器构建并部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: PROD_DB_PASSWORD,PROD_SECRET_KEY
          command_timeout: "30m"
          script: |
            set -e
            cd /opt/campus-opinion

            echo "🔧 创建 .env..."
            cat > /tmp/campus-env << ENVEOF
            MYSQL_PASSWORD=$PROD_DB_PASSWORD
            SECRET_KEY=$PROD_SECRET_KEY
            MYSQL_DATABASE=campus_opinion
            DEBUG=False
            ENVEOF

            echo "📦 拉取基础镜像..."
            docker compose -f docker-compose.yml pull mysql redis 2>/dev/null || true

            echo "🔨 构建后端镜像..."
            docker compose -f docker-compose.yml build backend

            echo "🔨 构建前端镜像..."
            docker compose -f docker-compose.yml build frontend

            echo "🚀 启动服务..."
            docker compose -f docker-compose.yml --env-file /tmp/campus-env up -d

            rm /tmp/campus-env

            echo "⏳ 等待健康检查..."
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ 后端健康检查通过 (HTTP $STATUS)"
            else
              echo "⚠️ 后端健康检查未通过 (HTTP $STATUS)"
              docker compose logs backend --tail 20
            fi

            echo "🎉 部署完成"

        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
