# redis.conf — Redis 持久化配置文件
# 用于 Docker 部署，确保容器重启后数据不丢
# ==================================================

# ── RDB 快照（满足任一条件即存盘）──
save 900 1       # 15 分钟 ≥ 1 个 key 变化
save 300 10      # 5 分钟 ≥ 10 个 key 变化
save 60 10000    # 1 分钟 ≥ 10000 个 key 变化

# ── AOF 追加日志（更安全，重启时重放日志恢复）──
appendonly yes
appendfsync everysec

# ── RDB 与 AOF 并存（Redis 重启时优先用 AOF 恢复）──
# 详见: https://redis.io/topics/persistence

# ── 基础配置 ──
bind 0.0.0.0
port 6379
daemonize no
loglevel notice

# 键淘汰策略：最近最少使用
maxmemory-policy allkeys-lru

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
